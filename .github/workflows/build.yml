name: Build & Publish

# Monorepo CI for side-projects.
#
# How it works:
#   1. "detect" finds which top-level project folders changed in this push/PR
#      AND contain a Dockerfile. The list is fully dynamic — drop a new folder
#      with a Dockerfile into the repo and it is picked up automatically, no
#      edits to this file required.
#   2. "build" runs once per changed project (matrix). It builds the Docker
#      image and, on pushes to main, publishes it to the GitHub Container
#      Registry (ghcr.io). Pull requests only build to verify — they never push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        name: Compute changed projects
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # If the base is missing (new branch / first push / force push),
          # diff against the empty tree so EVERY project is considered changed.
          EMPTY_TREE="$(git hash-object -t tree /dev/null)"
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$EMPTY_TREE"
          fi

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$CHANGED"

          PROJECTS="$(echo "$CHANGED" \
            | awk -F/ 'NF > 1 { print $1 }' \
            | sort -u \
            | while read -r d; do if [ -f "$d/Dockerfile" ]; then echo "$d"; fi; done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "Projects to build: $PROJECTS"

  build:
    name: Build ${{ matrix.project }}
    needs: detect
    if: needs.detect.outputs.projects != '' && needs.detect.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name (lowercase)
        id: img
        run: |
          name="$(echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
